[package]
name = "journey-model-parser"
version = "0.9.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[[bin]]
name = "journey-model-parser"
path = "src/bin/main.rs"
test = false

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-xml-rs = "0.7.1"
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
